worker_processes 1;
pid "__PROJECT_ROOT__/deploy/nginx.pid";
error_log stderr;
events { worker_connections 512; }
http {
  include mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  client_body_temp_path "__PROJECT_ROOT__/deploy/runtime/client";
  proxy_temp_path "__PROJECT_ROOT__/deploy/runtime/proxy";
  fastcgi_temp_path "__PROJECT_ROOT__/deploy/runtime/fastcgi";
  uwsgi_temp_path "__PROJECT_ROOT__/deploy/runtime/uwsgi";
  scgi_temp_path "__PROJECT_ROOT__/deploy/runtime/scgi";
  server {
    listen __PUBLIC_PORT__;
    server_name _;
    root "__PROJECT_ROOT__/frontend/dist";
    index index.html;
    client_max_body_size 6m;
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api { return 404; }
    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
